<!doctype html>
<html lang="en" data-kit="sim" data-theme="dark" data-density="compact">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Daylight</title>
    <link rel="stylesheet" href="/src/kit.css" />
    <script>
      // Theme before the first paint: the saved choice, else the browser / OS setting. The app's toggle keeps
      // data-theme set (cssVar() caches per theme), so kit-ui's own system fallback is not relied on.
      try {
        var t = localStorage.getItem('daylight.theme');
        document.documentElement.dataset.theme = t === 'light' || t === 'dark' ? t : matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      } catch (e) { /* storage blocked: the attribute above stays */ }
    </script>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
